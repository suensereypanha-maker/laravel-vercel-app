name: Telegram Deployment & Push Alerts

on:
  push:
    branches: [ main ]
  deployment_status:

jobs:
  notify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Alert to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=🚀 <b>New Commit Pushed!</b>

📦 <b>Repo:</b> ${{ github.repository }}
🌿 <b>Branch:</b> ${{ github.ref_name }}
👤 <b>Author:</b> ${{ github.actor }}
💬 <b>Commit:</b> ${{ github.event.head_commit.message }}

⏳ <i>Vercel build is in progress...</i>"

  notify-deploy:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state != 'pending'
    runs-on: ubuntu-latest
    steps:
      - name: Send Deployment Status Alert to Telegram
        run: |
          STATE="${{ github.event.deployment_status.state }}"
          TARGET_URL="${{ github.event.deployment_status.target_url }}"

          if [ "$STATE" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="<b>Vercel Deployment Succeeded!</b>"
          else
            EMOJI="❌"
            STATUS_TEXT="<b>Vercel Deployment Failed!</b>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${EMOJI} ${STATUS_TEXT}

📦 <b>Repo:</b> ${{ github.repository }}
⚙️ <b>Env:</b> ${{ github.event.deployment.environment }}
📊 <b>Status:</b> ${STATE}
🔗 <b>Live URL:</b> ${TARGET_URL}"
